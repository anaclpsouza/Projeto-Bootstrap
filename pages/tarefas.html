<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskSync - Gestão de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="shortcut icon" href="../img/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="theme-wrapper">
        <header>
            <nav class="navbar navbar-expand-lg bg-transparent border-bottom py-2">
                <div class="container">
                    <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
                        <img src="../img/logo.svg" alt="TaskSync Logo" width="40" height="40"
                            class="rounded-3 shadow-sm brand-logo">
                        <span class="fw-bold fs-4 text-primary">TaskSync</span>
                    </a>
                    <!-- DESAFIO ETAPA 1 (Menu Sem JS) -->
                    <label for="menu-toggle" class="d-lg-none ms-auto me-2 menu-toggler">
                        <i class="bi bi-list fs-2"></i>
                    </label>
                    <input type="checkbox" id="menu-toggle" class="menu-mobile-checkbox">
                    <div class="collapse navbar-collapse d-lg-flex justify-content-lg-end mobile-menu-content">
                        <ul class="navbar-nav mb-2 mb-lg-0 gap-3 align-items-lg-center mt-3 mt-lg-0">
                            <li class="nav-item">
                                <a class="nav-link fw-medium" href="../index.html#dashboard">Dashboard</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link fw-medium" href="../index.html#projetos">Meus Projetos</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link fw-medium" href="../index.html#atividades">Relatórios</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active fw-bold" aria-current="page" href="tarefas.html">Gestão de Tarefas</a>
                            </li>
                        </ul>
                        <div class="d-flex ms-lg-4 mt-3 mt-lg-0 gap-2 align-items-center">
                            <button class="btn btn-outline-dark" type="button"><i
                                    class="bi bi-person-fill h4"></i></button>
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <!-- ETAPA 5 - FORMULÁRIOS -->
            <section class="py-5 bg-light">
                <div class="container">
                    <div class="text-center mb-5">
                        <h2 class="display-6 fw-bold text-primary">Gestão de Tarefas</h2>
                        <p class="text-body-secondary">Crie novas tarefas ou aloque membros da equipe para os projetos atuais.</p>
                    </div>

                    <div class="row g-4">
                        <!-- Formulário 1: Nova Tarefa -->
                        <div class="col-lg-6">
                            <div class="bg-body rounded-3 shadow-sm p-4 p-lg-5 h-100">
                                <h3 class="h4 fw-bold mb-4">Adicionar Nova Tarefa</h3>
                                <form>
                                    <div class="row g-3 mb-3">
                                        <div class="col-md-8">
                                            <label for="nomeTarefa" class="form-label fw-medium">Nome da Tarefa</label>
                                            <input type="text" class="form-control is-valid" id="nomeTarefa" value="Redesign da Página de Preços" required>
                                            <div class="valid-feedback">Título claro e objetivo!</div>
                                        </div>
                                        <div class="col-md-4">
                                            <label for="prioridade" class="form-label fw-medium">Prioridade</label>
                                            <select class="form-select" id="prioridade">
                                                <option value="1">Baixa</option>
                                                <option value="2">Média</option>
                                                <option value="3" selected>Alta</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="prazo" class="form-label fw-medium">Prazo de Entrega (Deadline)</label>
                                        <input type="date" class="form-control is-invalid" id="prazo" value="2024-01-01" required>
                                        <div class="invalid-feedback">O prazo não pode ser uma data no passado.</div>
                                    </div>

                                    <div class="mb-4">
                                        <label for="descricao" class="form-label fw-medium">Descrição Detalhada</label>
                                        <textarea class="form-control" id="descricao" rows="4" placeholder="Descreva os requisitos, links úteis e o que é esperado como entrega final..." required></textarea>
                                    </div>

                                    <div class="mb-4">
                                        <label for="anexo" class="form-label fw-medium">Anexos e Referências (Opcional)</label>
                                        <input class="form-control" type="file" id="anexo">
                                    </div>

                                    <button type="button" class="btn btn-primary w-100 fw-bold">Criar Tarefa</button>
                                </form>
                            </div>
                        </div>

                        <!-- Formulário 2: Adicionar Membros -->
                        <div class="col-lg-6">
                            <div class="bg-body rounded-3 shadow-sm p-4 p-lg-5 h-100">
                                <h3 class="h4 fw-bold mb-4">Alocar Membros em Tarefas</h3>
                                <form>
                                    <div class="mb-3">
                                        <label for="tarefaExistente" class="form-label fw-medium">Selecione a Tarefa</label>
                                        <select class="form-select" id="tarefaExistente">
                                            <option selected>Selecione uma tarefa em andamento...</option>
                                            <option value="1">Deploy da Landing Page</option>
                                            <option value="2">Correção de Bug no Carrinho</option>
                                            <option value="3">Atualização do Guia de Marca</option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label for="emailMembro" class="form-label fw-medium">E-mail do Membro</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-envelope-at"></i></span>
                                            <input type="email" class="form-control" id="emailMembro" placeholder="nome@empresa.com" required>
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label fw-medium d-block">Função na Tarefa</label>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="funcaoRadios" id="funcaoResp" value="responsavel" checked>
                                            <label class="form-check-label" for="funcaoResp">Responsável Principal</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="funcaoRadios" id="funcaoObs" value="observador">
                                            <label class="form-check-label" for="funcaoObs">Apenas Observador (Leitura)</label>
                                        </div>
                                    </div>

                                    <div class="form-check mb-4">
                                        <input class="form-check-input" type="checkbox" id="emailNotif" checked>
                                        <label class="form-check-label" for="emailNotif">
                                            Enviar e-mail com notificação de alocação e link da tarefa.
                                        </label>
                                    </div>

                                    <button type="button" class="btn btn-outline-dark w-100 fw-bold">Adicionar Membro</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
