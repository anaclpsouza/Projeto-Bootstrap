<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="img/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>TaskSync | Gestão Eficiente </title>
</head>
<body>
    <div class="theme-wrapper">
        <header>
            <nav class="navbar navbar-expand-lg bg-transparent border-bottom py-3">
                <div class="container">
                    <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                        <img src="img/logo.svg" alt="TaskSync Logo" width="40" height="40"
                            class="rounded-3 shadow-sm brand-logo">
                        <span class="fw-bold fs-4 text-primary">TaskSync</span>
                    </a>
                    <!-- DESAFIO ETAPA 1 (Menu Sem JS) -->
                    <label for="menu-toggle" class="d-lg-none ms-auto me-2 menu-toggler">
                        <i class="bi bi-list fs-2"></i>
                    </label>
                    <input type="checkbox" id="menu-toggle" class="menu-mobile-checkbox">
                    <div class="collapse navbar-collapse d-lg-flex justify-content-lg-end mobile-menu-content">
                        <ul class="navbar-nav mb-2 mb-lg-0 gap-3 align-items-lg-center mt-3 mt-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active fw-bold" aria-current="page" href="#">Dashboard</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link fw-medium" href="#">Meus Projetos</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link fw-medium" href="#">Relatórios</a>
                            </li>
                        </ul>
                        <div class="d-flex ms-lg-4 mt-3 mt-lg-0 gap-2 align-items-center">
                            <button class="btn btn-outline-dark" type="button"><i class="bi bi-person-fill h4"></i></button>
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <!-- ETAPA 2 - HERO SECTION -->
            <section class="py-5 my-lg-5">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-lg-6 order-2 order-lg-1 text-center text-lg-start mt-4 mt-lg-0">
                            <h1 class="display-4 fw-bold text-primary mb-3">Sincronize sua rotina, maximize seu tempo</h1>
                            <p class="lead text-body-secondary mb-4">
                                O TaskSync é a plataforma definitiva para organizar projetos, definir metas
                                e acompanhar seus relatórios diários de forma simples e direta.
                            </p>
                            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center justify-content-lg-start">
                                <button class="btn btn-primary btn-lg px-4 fw-medium" type="button">Começar Agora</button>
                                <button class="btn btn-outline-dark btn-lg px-4 fw-medium" type="button">Saber Mais</button>
                            </div>
                        </div>
        
                        <div class="col-lg-6 order-1 order-lg-2 text-center">
                            <img src="img/logo.svg" alt="Ilustração TaskSync" class="img-fluid w-100 drop-shadow-lg">
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
