<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="img/logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>TaskSync | Gestão Eficiente </title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-transparent border-bottom py-3">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                    <img src="img/canvas.png" alt="TaskSync Logo" width="40" height="40"
                        class="rounded-3 shadow-sm brand-logo">
                    <span class="fw-bold fs-4 text-primary">TaskSync</span>
                </a>

                <!-- DESAFIO ETAPA 1 (Menu Sem JS) -->
                <label for="menu-toggle" class="d-lg-none ms-auto me-2 menu-toggler">
                    <i class="bi bi-list fs-2"></i>
                </label>
                <input type="checkbox" id="menu-toggle" class="menu-mobile-checkbox">

                <div class="collapse navbar-collapse d-lg-flex justify-content-lg-end mobile-menu-content">
                    <ul class="navbar-nav mb-2 mb-lg-0 gap-3 align-items-lg-center mt-3 mt-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active fw-bold" aria-current="page" href="#">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fw-medium" href="#">Meus Projetos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fw-medium" href="#">Relatórios</a>
                        </li>
                    </ul>

                    <div class="d-flex ms-lg-4 mt-3 mt-lg-0 gap-2 align-items-center">
                        <button class="btn btn-outline-dark" type="button"><i class="bi bi-person-square"></i></button>
                    </div>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
